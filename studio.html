<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Corrección del estándar: name="referrer" -->
    <meta name="referrer" content="strict-origin-when-cross-origin">
    
    <!-- Indicaciones para navegadores contra MIME-sniffing -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    
    <!-- Política de Seguridad de Contenido (CSP) -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data:; frame-src https://www.youtube-nocookie.com https://player.vimeo.com; object-src 'none'; base-uri 'self';">

    <title>Jose Luis · Proyectos</title> 
    
    <!-- Google Fonts · Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    
    <!-- Enlace de CSS con Integridad de Subrecursos (SRI) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" integrity="sha384-k6RqeWeci5ZR/Lv4MR0sA0FfDOMt23cefzX286515B2252C324A3e226d96a5839" crossorigin="anonymous">
    
    <!-- Estilos locales -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- HEADER FIJO -->
    <header>
        <div class="container header-inner">
            <div class="logo">Jose Luis Rodriguez</div>
            <nav>
                <ul>
                    <li><a href="#projects">Proyectos</a></li>
                    <li><a href="#">Sobre</a></li>
                    <li><a href="#">Contacto</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- HERO -->
    <section class="hero">
        <div class="hero-content">
            <img src="/img/img8k.jpg" alt="Imagen representativa de proyectos"> 
            <h1>Historias en<br />movimiento</h1>       
            <p style="margin-top: 0%;">Software | Tec Industrial | Soporte | Mantenimiento Preventivo</p>
        </div>
    </section>

    <!-- PROYECTOS -->
    <section class="projects-section" id="projects">
        <div class="container">
            <h2 class="section-title">Proyectos destacados</h2>
            <div class="projects-grid" id="projectsGrid"></div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        <div class="container footer-inner">
            <p>&copy; 2026 Software Development Jr Studio</p>
            <div class="socials">
                <!-- Se añade rel="noopener noreferrer" preventivo para enlaces externos -->
                <a href="#" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="#" target="_blank" rel="noopener noreferrer" aria-label="Vimeo"><i class="fab fa-vimeo-v"></i></a>
                <a href="#" target="_blank" rel="noopener noreferrer" aria-label="Behance"><i class="fab fa-behance"></i></a>
            </div>
        </div>
    </footer>

    <!-- Modal Lightbox con Iframe Sanitizado -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <button class="modal-close" id="modalClose" aria-label="Cerrar">
                <i class="fas fa-times"></i>
            </button>
            <div class="video-wrapper" id="modalVideoWrapper">
                <iframe id="modalIframe" src="about:blank" allowfullscreen loading="lazy" sandbox="allow-scripts allow-same-origin"></iframe>
            </div>
            <h2 id="modalTitle">Título</h2>
            <div class="meta">
                <span><i class="fas fa-tag"></i> <span id="modalCategory">Categoría</span></span>
                <span><i class="fas fa-calendar"></i> <span id="modalYear">2026</span></span>
            </div>
            <p class="description" id="modalDesc">Descripción del proyecto.</p>
            <div class="credits" id="modalCredits">Créditos: —</div>
        </div>
    </div>

<script src="script.js"></script>
</body> 
</html>
